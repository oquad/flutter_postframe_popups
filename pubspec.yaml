name: flutter_postframe_popups
description: >-
  Declarative popups, spotlights, layout-size reporting, and OS lifecycle,
  memory pressure, and global pointer observers with shared async error handling.
version: 0.3.0
homepage: https://github.com/oquad/flutter_postframe_popups
repository: https://github.com/oquad/flutter_postframe_popups
issue_tracker: https://github.com/oquad/flutter_postframe_popups/issues

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  dart_code_linter: 4.4.2
  flutter_lints: ^6.0.0

topics:
  - widgets
  - lifecycle
  - dialog
  - async
